{% extends 'layout/base.html' %}
{% block title %}Hồ sơ cá nhân{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    {% if message %}
        <div class="alert alert-{% if done %}success{% else %}danger{% endif %} fw-ligh d-flex" role="alert">
            <p class="mb-0 me-auto">{{ message }}</p>
            <a href="/profile"><button type="button" class="btn-close" aria-label="Close"></button></a>
        </div>
    {% endif %}
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4 text-center border-end">
                    <img src="https://static.vecteezy.com/system/resources/previews/046/010/545/non_2x/user-icon-simple-design-free-vector.jpg"
                         class="rounded-circle mb-3"
                         width="150" height="150">
                    <h5 class="mb-0">{{ person.name }}</h5>
                    <small class="text-muted">{{ current_user.user_role.name }}</small>
                </div>
                <div class="col-md-8 ps-4">
                    <form method="POST" id="profileForm">
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-control"
                                   name="name" value="{{ person.name }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control"
                                   name="phone" value="{{ person.phone }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control"
                                   name="email" value="{{ person.email }}" disabled>
                        </div>

                        {% if current_user.user_role.name == 'CUSTOMER' %}
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" class="form-control"
                                   name="address" value="{{ person.address }}" disabled>
                        </div>
                        {% endif %}
                        <div class="d-none" id="actionButtons">
                            <button type="submit" class="btn btn-dark">
                                <i class="bi bi-save"></i> Lưu
                            </button>
                            <button type="button" class="btn btn-secondary" id="cancel-edit">
                                Huỷ
                            </button>
                        </div>
                    </form>
                    <div class="mt-3 mb-3a">
                            <button class="btn btn-outline-dark" id="enable-edit">
                                <i class="bi bi-pencil"></i> Chỉnh sửa
                            </button>
                        </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
