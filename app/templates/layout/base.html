<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>{% block title %}{% endblock %}</title>
    <link rel="shortcut icon" href="https://res.cloudinary.com/dphz3ewhr/image/upload/v1765358529/logoneww_1_leugzi.png"
          type="image/x-icon">
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.js" type="text/javascript"></script>
    <script src="{{ url_for('static', filename = 'js/script.js') }}"></script>
    <script src="{{ url_for('static', filename = 'js/order.js') }}"></script>
    {% block script %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename = 'css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.3/lux/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-body-secondary bg-opacity-25 position-relative">
{% block header %}
    {% include 'layout/header.html' %}
{% endblock %}

<div class="container-fluid p-0">
{% block content %}
{% endblock %}
</div>

<div id="custom-alert"
     class="d-none position-fixed top-50 start-50 translate-middle bg-white shadow-lg p-4 text-center border-2"
     style="z-index: 9999; width: 50vw;">
    <h2 class="fw-bold mb-2 py-4">
        <i class="bi bi-bell"></i>
        Thông báo
    </h2>
    <div>
        <p id="alert-body" class="text-muted mb-0">Nội dung chi tiết...</p>
    </div>
    <button class="btn btn-close close-alert position-absolute top-0 end-0 p-3"></button>
    <button class="btn btn-outline-secondary close-alert px-3 mt-4">Đóng</button>
    <button id="my-confirm"  class="btn btn-info close-alert px-3 mt-4">Đồng ý</button>
</div>

<button type="button" class="btn btn-warning btn-sm fw-bolder" id="btn-back-to-top">
    <i class="bi bi-arrow-up"></i>
</button>

{% block footer %}
    {% include 'layout/footer.html' %}
{% endblock %}
</body>
</html>
