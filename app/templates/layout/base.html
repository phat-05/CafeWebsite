<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>{% block title %}{% endblock %}</title>
    <link rel="shortcut icon" href="https://res.cloudinary.com/dphz3ewhr/image/upload/v1765358529/logoneww_1_leugzi.png"
          type="image/x-icon">
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.js" type="text/javascript"></script>
    <script src="../../static/js/{% block js %}script{% endblock %}.js"></script>
    <link rel="stylesheet" href="../../static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-body-secondary bg-opacity-25 position-relative">
{% block header %}
    {% include 'layout/header.html' %}
{% endblock %}

<div class="container-fluid p-0">
{% block content %}
{% endblock %}
</div>
<button type="button" class="btn btn-warning btn-lg rounded fw-bolder" id="btn-back-to-top">
    <i class="bi bi-chevron-double-up"></i>
</button>

{% block footer %}
    {% include 'layout/footer.html' %}
{% endblock %}
</body>
</html>
