{% extends 'admin/master.html' %}

{% block body %}
<div class="container-fluid mt-3">
  <div class="card border-primary">
    <div class="card-header bg-primary text-white">
      <h5 class="m-0 text-uppercase" style="color: white !important;">
        <i class="fa fa-download mr-2"></i> Phiếu nhập kho
      </h5>
    </div>

    <div class="card-body p-3">
      <form method="POST" action="">
        <table class="table table-bordered table-striped table-hover" id="importTable">
          <thead class="thead-dark">
          <tr>
            <th style="width: 5%;" class="text-center">#</th>
            <th style="width: 35%;">Tên nguyên liệu</th>
            <th style="width: 15%;">Đơn vị</th>
            <th style="width: 20%;">Số lượng</th>
            <th style="width: 20%;">Ngày nhập</th>
            <th style="width: 5%;" class="text-center">Xóa</th>
          </tr>
          </thead>
          <tbody id="tableBody">
          <tr>
            <td class="text-center align-middle stt">1</td>
            <td>
              <select name="ingredient_id[]" class="form-control" onchange="updateUnit(this)" required>
                <option value="" data-unit="" disabled selected>-- Chọn món --</option>
                {% for item in ingredients %}
                <option value="{{ item.id }}" data-unit="{{ item.unit }}">
                  {{ item.name }} (Tồn: {{ item.remaining }})
                </option>
                {% endfor %}
              </select>
            </td>
            <td>
              <input type="text" class="form-control unit-display" disabled readonly style="background-color: #f8f9fa;">
            </td>
            <td>
              <input type="number" step="0.1" name="quantity[]" class="form-control" placeholder="0"
                     min="0"  required>
            </td>
            <td>
              <input type="date" max="" name="received_date[]" class="form-control" required>
            </td>
            <td class="text-center align-middle">
              <button type="button" class="btn btn-outline-danger" onclick="removeRow(this)">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>
          </tbody>
        </table>

        <div class="row mt-3">
          <div class="col-6">
            <button type="button" class="btn btn-secondary" onclick="addRow()">
              <i class="fa fa-plus"></i> Thêm dòng
            </button>
          </div>
          <div class="col-6 text-right">
            <button type="submit" class="btn btn-primary">
              <i class="fa fa-save"></i> LƯU PHIẾU
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>

  function updateUnit(selectElement) {
    const selectedOption = selectElement.options[selectElement.selectedIndex];
    const unit = selectedOption.getAttribute('data-unit');
    const row = selectElement.closest('tr');
    row.querySelector('.unit-display').value = unit || '';
  }


  function addRow() {
    const tableBody = document.getElementById('tableBody');
    const firstRow = tableBody.rows[0];


    const newRow = firstRow.cloneNode(true);

    // Reset giá trị về rỗng
    newRow.querySelector('select').selectedIndex = 0;
    newRow.querySelector('.unit-display').value = "";
    newRow.querySelector('input[type="number"]').value = "";


    const today = new Date().toISOString().split('T')[0];
    newRow.querySelector('input[type="date"]').value = today;

    tableBody.appendChild(newRow);
    updateSTT();
  }


  function removeRow(button) {
    const tableBody = document.getElementById('tableBody');
    if (tableBody.rows.length > 1) {
      button.closest('tr').remove();
      updateSTT();
    }
  }


  function updateSTT() {
    const rows = document.querySelectorAll('#tableBody tr');
    rows.forEach((row, index) => {
      row.querySelector('.stt').innerText = index + 1;
    });
  }


  document.addEventListener("DOMContentLoaded", function() {
    const dateInputs = document.querySelectorAll('input[type="date"]');
    const today = new Date().toISOString().split('T')[0];
    dateInputs.forEach(input => input.value = today);
  });
</script>
{% endblock %}
