{% extends 'layout/base.html' %}

{% block title %}Trang chủ - HaiLan Cafe{% endblock %}

{% block content %}
<!-- Carousel Banner -->
<div class="carousel slide" data-bs-ride="carousel" id="carouselExampleIndicators">
    <div class="carousel-indicators">
        {% for b in banners %}
        <button {% if loop.first %}
                aria-current="true"
                {% endif %}
                {% if loop.first %}
                class="active"
                {% endif %}
                aria-label="Slide {{ loop.index }}"
                data-bs-slide-to="{{ loop.index0 }}"
                data-bs-target="#carouselExampleIndicators"
                type="button">
        </button>
        {% endfor %}
    </div>
    <div class="carousel-inner">
        {%  for b in banners %}
        <div class="carousel-item {% if loop.first %}active{% endif %} ratio ratio-21x9">
            <img alt="banner" class="d-block object-fit-fill" src="{{ b.image }}">
        </div>
        {% endfor %}
    </div>
    <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#carouselExampleIndicators"
            type="button">
        <span aria-hidden="true" class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#carouselExampleIndicators"
            type="button">
        <span aria-hidden="true" class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

<!-- Hiển thị sản phẩm bán chạy -->


{% endblock %}
