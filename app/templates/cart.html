{% extends 'layout/base.html' %}

{% block title %}Giỏ hàng{% endblock %}
{% block content %}
<div class="container my-4">
    <div class="row">
        <!-- Cart items -->
        <div class="col-md-8">
            <h3 class="mb-3">Giỏ hàng</h3>

            <ul class="list-group mb-3">
                <!-- Item -->
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div class="d-flex">
                        <img src="https://via.placeholder.com/80" class="rounded me-3" alt="">
                        <div>
                            <h6 class="my-0">Cà phê sữa</h6>
                            <small class="text-muted">Size M</small>
                        </div>
                    </div>
                    <div class="text-end">
                        <span class="text-muted">28.000đ</span><br>
                        <input type="number" class="form-control form-control-sm mt-2" style="width: 70px;" value="1">
                    </div>
                </li>

                <!-- Item -->
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div class="d-flex">
                        <img src="https://via.placeholder.com/80" class="rounded me-3" alt="">
                        <div>
                            <h6 class="my-0">Trà đào</h6>
                            <small class="text-muted">Size L</small>
                        </div>
                    </div>
                    <div class="text-end">
                        <span class="text-muted">32.000đ</span><br>
                        <input type="number" class="form-control form-control-sm mt-2" style="width: 70px;" value="2">
                    </div>
                </li>

            </ul>
        </div>

        <!-- Summary -->
        <div class="col-md-4">
            <div class="card p-3 sticky-top">
                <h5 class="mb-3">Tổng tiền</h5>

                <div class="d-flex justify-content-between">
                    <span>Tạm tính</span>
                    <strong>92.000đ</strong>
                </div>

                <div class="d-flex justify-content-between">
                    <span>Phí giao hàng</span>
                    <strong>10.000đ</strong>
                </div>

                <hr>

                <div class="d-flex justify-content-between">
                    <span><strong>Tổng cộng</strong></span>
                    <strong class="text-primary">102.000đ</strong>
                </div>

                <button class="btn btn-primary w-100 mt-3">Thanh toán</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
