<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>{% block title %}Trang Đăng Nhập{% endblock %}</title>
    <link rel="shortcut icon" href="https://res.cloudinary.com/dphz3ewhr/image/upload/v1765358529/logoneww_1_leugzi.png"
          type="image/x-icon">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="row g-3 overflow-hidden login">
{% block content %}
<div class="position-absolute col-7 min-vh-100 bg-dark start-0 opacity-50 z-n1"></div>
<div class="col-7 p-5 text-white shadow">
    <h1 class="fw-bold display-5">Chào mừng bạn trở lại 👋</h1>
    <p class="mt-3 fs-5 text-b">
        Rất vui được gặp lại bạn!<br>
        Hãy đăng nhập để tiếp tục trải nghiệm hệ thống.
    </p>
</div>
<div class="bg-body position-absolute vh-100 d-flex align-items-center justify-content-center col-5 p-5 end-0">
    <form class="row g-3">
        <h1 class="col-12 text-center mb-5 fw-bolder fs-1">Trang Đăng Nhập</h1>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="name@example.com">
            <label for="email" ><i class="bi bi-envelope"></i> Email</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="password" placeholder="Password">
            <label for="password" ><i class="bi bi-lock"></i> Mật khẩu</label>
        </div>
        <div class="col-6">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="gridCheck">
                <label class="form-check-label" for="gridCheck">
                    Ghi nhớ đăng nhập
                </label>
            </div>
        </div>
        <div class="col-6 text-end">
            <p><a href="#" class="link-secondary disabled">Quên mật khẩu?</a></p>
        </div>
        <div class="col-12 text-center mt-5">
            <button type="submit" class="btn btn-primary">Đăng Nhập</button>
        </div>
        <div class="col-12 text-center mt-5">
            <p class="text-secondary">Bạn chưa có tài khoản? <a href="/register" class="link-secondary">Đăng Ký</a></p>
        </div>
        <div class="col-12 mt-5">
            <p class="text-center">
                <a href="/" class="link-secondary">Trang chủ</a>
                <i class="bi bi-link"></i>
                <a href="/menu" class="link-secondary">Thực đơn</a>
                <i class="bi bi-link"></i>
                <a href="/about-us" class="link-secondary">Về chúng tôi</a>
            </p>
        </div>
    </form>
</div>
{% endblock %}
</body>
</html>
